apiVersion: v1                     
kind: Namespace
metadata:
  name: ibm-installer
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: ibm-installer-admin
  namespace: ibm-installer
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ibm-installer-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ibm-installer-admin
    namespace: ibm-installer
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ibm-installer-default-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ibm-installer
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibm-delete-operate
  namespace: ibm-installer
  annotations: {}
spec:
  serviceAccount: ibm-installer-admin
  selector:
    matchLabels:
      app: ibm-operate-wipe-install
  replicas: 1
  template:
    metadata:
      labels:
        app: ibm-operate-wipe-install
    spec:
      containers:
        - name: tools
          image: quay.io/niklaushirt/ibm-concert-tools:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env: []
          resources:
            requests:
              memory: "64Mi"
              cpu: "150m"
            limits:
              memory: "2024Mi"
              cpu: "1200m"
          command:
            - /bin/sh
            - -c
            - |
              #!/bin/bash
              #set -x

              echo "*****************************************************************************************************************************"
              echo " ✅ STARTING: DELETE OPERATE"
              echo "*****************************************************************************************************************************"
              echo ""
              echo "  ⏳ INSTALLATION START TIMESTAMP: $(date)"
              echo ""
              echo "------------------------------------------------------------------------------------------------------------------------------"
    


              #oc delete ConsoleNotification --all &

              echo "*****************************************************************************************************************************"
              echo " 💣 WIPE CUSTOM NAMESPACES"
              echo "*****************************************************************************************************************************"
              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Delete Namespace sock-shop"
              oc delete ns sock-shop &
              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Delete Namespace robot-shop"
              oc delete ns robot-shop &
              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Delete Namespace awx"
              oc delete ns awx &
              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Delete awx.ansible.com CustomResourceDefinition"
              oc delete CustomResourceDefinition $(oc get CustomResourceDefinition| grep awx.ansible.com|awk '{print$1}') --ignore-not-found
              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Delete Namespace ibm-demo-ui"
              oc delete ns ibm-demo-ui &
              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Delete Namespace ibm-concert-operate-tools"
              oc delete ns ibm-concert-operate-tools &
              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Delete Namespace openldap"
              oc delete ns openldap &


              echo "*****************************************************************************************************************************"
              echo " 💣 WIPE OPERATE"
              echo "*****************************************************************************************************************************"
            

              export PROJECT_CP4AIOPS=ibm-concert-operate
              export INSTALLATION_NAME="$(oc get installation.orchestrator.aiops.ibm.com -n ${PROJECT_CP4AIOPS} -o jsonpath="{.items[0].metadata.name}")"

              echo "    ------------------------------------------------------------------------------------------------------------------------------"
              echo "     🧻 Deleting Concert Operate Instance ${INSTALLATION_NAME} in Namespace ${PROJECT_CP4AIOPS}"

              oc delete installation ${INSTALLATION_NAME} -n ${PROJECT_CP4AIOPS}
              
              remaining=$(oc get installation -n ${PROJECT_CP4AIOPS} --no-headers | wc -l)
              while [[ $remaining -gt 0 ]]; do
                sleep 10
                remaining=$(oc get installation -n ${PROJECT_CP4AIOPS} --no-headers | wc -l)
              done


              echo "    ------------------------------------------------------------------------------------------------------------------------------"
              echo "      🧻 Delete Namespace ibm-concert-operate"
              oc delete ns ibm-concert-operate
              oc delete ConsoleNotification --all


              echo "    ------------------------------------------------------------------------------------------------------------------------------"
              echo "      🧻 Delete remaining stuff"

              remaining=$(oc get installation.orchestrator.aiops.ibm.com -n ${PROJECT_CP4AIOPS} --no-headers | wc -l)
              while [[ $remaining -gt 0 ]]; do

                oc delete persistentVolumeClaims -n ${PROJECT_CP4AIOPS} --all &
                oc delete installations.orchestrator.aiops.ibm.com -n ${PROJECT_CP4AIOPS} --all &
                oc delete operandconfigs.operator.ibm.com -n ${PROJECT_CP4AIOPS} --all &
                oc delete operandregistries.operator.ibm.com -n ${PROJECT_CP4AIOPS} --all &
                oc delete operandrequests.operator.ibm.com -n ${PROJECT_CP4AIOPS} --all &

                sleep 30

                CSV_NAME=$(oc get operandconfigs.operator.ibm.com -n ${PROJECT_CP4AIOPS} --no-headers | grep ibm-aiops | awk '{print $1}')
                oc patch operandconfigs.operator.ibm.com ${CSV_NAME} -n ${PROJECT_CP4AIOPS} --type json -p='[{"op": "remove", "path": "/metadata/finalizers"}]'
                CSV_NAME=$(oc get operandregistries.operator.ibm.com -n ${PROJECT_CP4AIOPS} --no-headers | grep ibm-aiops | awk '{print $1}')
                oc patch operandregistries.operator.ibm.com ${CSV_NAME} -n ${PROJECT_CP4AIOPS} --type json -p='[{"op": "remove", "path": "/metadata/finalizers"}]'
                CSV_NAME=$(oc get operandregistries.operator.ibm.com -n ${PROJECT_CP4AIOPS} --no-headers | grep aiops-foundational-services | awk '{print $1}')
                oc patch operandregistries.operator.ibm.com ${CSV_NAME} -n ${PROJECT_CP4AIOPS} --type json -p='[{"op": "remove", "path": "/metadata/finalizers"}]'
                CSV_NAME=$(oc get operandrequests.operator.ibm.com -n ${PROJECT_CP4AIOPS} --no-headers | grep aiops-platformui-operator | awk '{print $1}')
                oc patch operandrequests.operator.ibm.com ${CSV_NAME} -n ${PROJECT_CP4AIOPS} --type json -p='[{"op": "remove", "path": "/metadata/finalizers"}]'
                CSV_NAME=$(oc get installations.orchestrator.aiops.ibm.com -n ${PROJECT_CP4AIOPS} --no-headers | grep ibm-concert-operate | awk '{print $1}')
                oc patch installations.orchestrator.aiops.ibm.com ${CSV_NAME} -n ${PROJECT_CP4AIOPS} --type json -p='[{"op": "remove", "path": "/metadata/finalizers"}]'

                remaining=$(oc get installation.orchestrator.aiops.ibm.com -n ${PROJECT_CP4AIOPS} --no-headers | wc -l)
              done


              # CSV_NAME=$(oc get csv -n ${PROJECT_CP4AIOPS} --no-headers | grep ibm-aiops-orchestrator | awk '{print $1}')
              # oc delete csv ${CSV_NAME} -n ${PROJECT_CP4AIOPS}



              # oc delete subscription ibm-aiops-orchestrator -n ${PROJECT_CP4AIOPS}
              # oc delete pod -l app.kubernetes.io/name=ibm-aiops-orchestrator-controller-manager -n ${PROJECT_CP4AIOPS}


              # # For CSV
              # CSV_NAME=$(oc get csv -n ${PROJECT_CP4AIOPS} --no-headers | grep ibm-aiops-orchestrator | awk '{print $1}')
              # oc patch csv ${CSV_NAME} -n ${PROJECT_CP4AIOPS} --type json -p='[{"op": "remove", "path": "/metadata/finalizers"}]'

              # # For Subscription
              # oc patch subscription ibm-aiops-orchestrator -n ${PROJECT_CP4AIOPS} --type json -p='[{"op": "remove", "path": "/metadata/finalizers"}]'

              # oc delete catalogsource -n ${PROJECT_CP4AIOPS} ibm-aiops-catalog

              # oc get catalogsource -n ${PROJECT_CP4AIOPS}





              echo "*****************************************************************************************************************************"
              echo " 💣 WIPE REMAINING STUFF"
              echo "*****************************************************************************************************************************"
              echo ""
              echo "  ⏳ INSTALLATION START TIMESTAMP: $(date)"
              echo ""


              oc delete serviceaccount -n default demo-admin

              oc delete ClusterRoleBinding admin-demo-user                   
              oc delete ClusterRoleBinding admin-nik-user                    
              oc delete ClusterRoleBinding awx-default                       
              oc delete ClusterRoleBinding default-robotinfo1-admin          
              oc delete ClusterRoleBinding default-robotinfo2-admin          
              oc delete ClusterRoleBinding default-sockinfo1-admin           
              oc delete ClusterRoleBinding default-sockinfo2-admin           
              oc delete ClusterRoleBinding ibm-demo-ui-admin-crb       
              oc delete ClusterRoleBinding ibm-installer-admin         
              oc delete ClusterRoleBinding robot-shop                        
              oc delete ClusterRoleBinding test-admin    



              oc delete ConsoleLink ibm-concert-operate-aimanager
              oc delete ConsoleLink ibm-concert-operate-aimanager-demo
              oc delete ConsoleLink ibm-concert-operate-awx
              oc delete ConsoleLink ibm-concert-operate-flink-connectors
              oc delete ConsoleLink ibm-concert-operate-flink-policy
              oc delete ConsoleLink ibm-concert-operate-ldap
              oc delete ConsoleLink ibm-concert-operate-robotshop
              oc delete ConsoleLink ibm-concert-operate-sockshop
              oc delete ConsoleLink ibm-concert-operate-spark



              
              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Restart OLM Pod"
              oc -n openshift-operator-lifecycle-manager delete $(oc get pods  -l app=catalog-operator -o NAME -n openshift-operator-lifecycle-manager)

              echo "------------------------------------------------------------------------------------------------------------------------------"
              echo " 🧻 Delete Namespace ibm-installer"
              oc delete ns ibm-installer &
              sleep 10
              oc delete ClusterRoleBinding ibm-installer-default-admin &
              oc delete deployment ibm-operate-wipe-install &

              echo ""
              echo ""
              echo "  ⏳ INSTALLATION END TIMESTAMP: $(date)"
              echo ""
              echo "*****************************************************************************************************************************"
              echo " ✅ INITIALIZATION - WAITING FOREVER"
              echo "*****************************************************************************************************************************"


              while true
              do
                sleep 1000
              done

      imagePullSecrets: []
  paused: false


