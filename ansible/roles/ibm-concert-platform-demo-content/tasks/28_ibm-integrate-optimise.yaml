---

# *************************************************************************************************************************************************
# --------------------------------------------------------------------------------------------------------------------------------------
# Integrate with IBM Concert Optimise
# --------------------------------------------------------------------------------------------------------------------------------------
# *************************************************************************************************************************************************

- name: 🛰️  START - Integrate with IBM Concert Optimise
  debug: 
    msg="{{ lookup('pipe','date +%d.%m.%Y---%H:%M:%S') }}"



- name: Log
  shell: |
    export MESSAGE="Integrate with IBM Concert Optimise"
    export currentDate=$(date +%Y-%m-%d_%H:%M)
    echo "---------------------------------------------------------------------------------------------------------------------------------------------------" >> ../install_{{current_feature.kind}}.log
    echo $currentDate" - "$MESSAGE  >> ../install_{{current_feature.kind}}.log
  ignore_errors: true

- name: 📣 OCP CONSOLE - Create Openshift NOTIFICATION
  shell: |
    cat <<EOF | oc apply -f -
    apiVersion: console.openshift.io/v1
    kind: ConsoleNotification
    metadata:
      name: ibm-concert-operate-notification-status
    spec:
      backgroundColor: '#ffd500'
      color: '#000'
      location: {{global_config.position_ocp_notifications | default("BannerTop")}}
      text: 'Installing {{current_feature.kind}} - Integrate with IBM Concert Optimise'    
    EOF
  ignore_errors: true
  args:
    executable: /bin/bash
  when: (global_config.create_ocp_notifications | default(true))|bool == true  




- name: 🚀 CONCERT OPTIMISE - INTEGRATE WITH CONCERT PLATFORM - PATCH
  kubernetes.core.k8s:
    state: present
    template: ./templates/optimize/patch.j2
    apply: yes
  ignore_errors: true


- name: 🚀 CONCERT OPTIMISE - INTEGRATE WITH CONCERT PLATFORM - RESTART
  shell: |
    #oc patch xl xl-release -n ibm-concert-optimise --type=merge --patch-file PATCH.yaml
    oc rollout restart deployment/api deployment/auth deployment/consul deployment/nginx deployment/oauth2 -n ibm-concert-optimise
    oc get pods -n ibm-concert-optimise | grep "concert"
    echo ""
    echo ""
  ignore_errors: true
  register: output
  args:
    executable: /bin/bash
- name: 🟣  OUTPUT
  debug:
    var: output.stdout_lines
    verbosity: 1


- name: 🕦 CONCERT OPTIMISE - Wait for all pods in ibm-concert-optimise to become ready
  shell: oc get po -n ibm-concert-optimise | grep "0/" | grep -c ""
  register: kubectl_get_pods
  until: (kubectl_get_pods.stdout | int) < 1
  failed_when: kubectl_get_pods.rc not in [0, 1]
  changed_when: false
  retries: 500
  delay: 15
