# Install Turbonomic
# --------------------------------------------------------------------------------------------------------------------------------------
# *************************************************************************************************************************************************

# --------------------------------------------------------------------------------------------------------------------------------------
# Install Turbonomic
# --------------------------------------------------------------------------------------------------------------------------------------

- name: 🛰️  START - INSTALL TURBONOMIC
  debug: 
    msg="{{ lookup('pipe','date +%d.%m.%Y---%H:%M:%S') }}"


- name: Log
  shell: |
    export MESSAGE="Installing TURBONOMIC"
    export currentDate=$(date +%Y-%m-%d_%H:%M)
    echo "---------------------------------------------------------------------------------------------------------------------------------------------------" >> ../install_{{current_feature.kind}}.log
    echo $currentDate" - "$MESSAGE  >> ../install_{{current_feature.kind}}.log
  ignore_errors: true

- name: 📣 OCP CONSOLE - Create Openshift NOTIFICATION
  shell: |
    cat <<EOF | oc apply -f -
    apiVersion: console.openshift.io/v1
    kind: ConsoleNotification
    metadata:
      name: ibm-concert-operate-notification-status
    spec:
      backgroundColor: '#ffd500'
      color: '#000'
      location: {{global_config.position_ocp_notifications | default("BannerTop")}}
      text: 'Installing {{current_feature.kind}} - Prerequisites'    
    EOF
  ignore_errors: true
  args:
    executable: /bin/bash
  when: (global_config.create_ocp_notifications | default(true))|bool == true  


- name: 🚀 TURBONOMIC - Create Turbonomic namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "turbonomic"
    state: present
  

- name: 🚀 TURBONOMIC - Create Turbonomic scc
  shell: |
    oc delete clusterrolebinding turbonomic-admin1 --ignore-not-found
    oc delete clusterrolebinding turbonomic-admin2 --ignore-not-found
    oc delete clusterrolebinding turbonomic-admin3 --ignore-not-found
    oc adm policy add-scc-to-group anyuid system:serviceaccounts:turbonomic
    oc create clusterrolebinding turbonomic-admin1 --clusterrole=cluster-admin --serviceaccount=turbonomic:t8c-operator
    oc create clusterrolebinding turbonomic-admin2 --clusterrole=cluster-admin --serviceaccount=turbonomic:turbo-user
    oc create clusterrolebinding turbonomic-admin3 --clusterrole=cluster-admin --serviceaccount=turbonomic:default
  ignore_errors: true
  register: demo_robot_shop
        
- name: 🚀 TURBONOMIC - Delete ClusterRoleBinding turbo-all-binding in case of ROKS
  shell: |
    oc delete clusterrolebinding turbo-all-binding -n turbonomic --ignore-not-found
  ignore_errors: true




- name: 👩‍💻 TURBONOMIC - Get FS Group from Namespace
  shell: |
        oc get ns turbonomic -o json | jq -r '.metadata.annotations["openshift.io/sa.scc.uid-range"] | split("/")[0]'
  ignore_errors: true
  args:
    executable: /bin/bash
  register: FS_GROUP


- name: 👩‍💻 TURBONOMIC - Set FS Group from Namespace {{ FS_GROUP.stdout }} 
  set_fact: FS_GROUP={{ FS_GROUP.stdout }} 





- name: 👩‍💻 TURBONOMIC - Get Concert Hub URL
  shell: |
        CONSOLE_PATH=$(oc get route -n openshift-console console -o jsonpath={.spec.host})
        CONSOLE_URL="https://"$CONSOLE_PATH
        API_URL=${CONSOLE_URL/console-openshift-console.apps/api}:6443
        BASE_URL=${CONSOLE_PATH/console-openshift-console.apps./}
        HUB_URL="https://solis-hub-ibm-concert-hub.apps."$BASE_URL
        echo ${HUB_URL}
  ignore_errors: true
  args:
    executable: /bin/bash
  register: HUB_URL


- name: 👩‍💻 TURBONOMIC - Set Get Concert Hub URL {{ HUB_URL.stdout }} 
  set_fact: HUB_URL={{ HUB_URL.stdout }} 




- name: 👩‍💻 TURBONOMIC - Get Concert Gateway Host
  shell: |
        CONSOLE_PATH=$(oc get route -n openshift-console console -o jsonpath={.spec.host})
        CONSOLE_URL="https://"$CONSOLE_PATH
        API_URL=${CONSOLE_URL/console-openshift-console.apps/api}:6443
        BASE_URL=${CONSOLE_PATH/console-openshift-console.apps./}
        PLATFORM_GW_HOST="solis-hub-ibm-concert-hub.apps."$BASE_URL
        echo ${PLATFORM_GW_HOST}
  ignore_errors: true
  args:
    executable: /bin/bash
  register: PLATFORM_GW_HOST


- name: 👩‍💻 TURBONOMIC - Set Get Concert Gateway Host {{ PLATFORM_GW_HOST.stdout }} 
  set_fact: PLATFORM_GW_HOST={{ PLATFORM_GW_HOST.stdout }} 



 
- name: 👩‍💻 TURBONOMIC - Install Ping
  shell: |
        apt update
        apt-get install -y iputils-ping
  ignore_errors: true
  args:
    executable: /bin/bash
  register: HOST_IP



- name: 👩‍💻 TURBONOMIC - Get External Cluster IP
  shell: |
        CONSOLE_PATH=$(oc get route -n openshift-console console -o jsonpath={.spec.host})
        EXT_IP=$(ping $CONSOLE_PATH -c 1 -q | grep -m1 "("| awk '{print $3}' | sed "s/[(]//" | sed "s/[)]//" | sed "s/[:]//")

        echo ${EXT_IP}
  ignore_errors: true
  register: HOST_IP


- name: 👩‍💻 TURBONOMIC - Set External Cluster IP {{ HOST_IP.stdout }} 
  set_fact: HOST_IP={{ HOST_IP.stdout }} 




- name: 🌐 TURBONOMIC - Create TLS Gateway Secret
  shell: |
        oc get secret -n openshift-ingress $(kubectl get secrets -n openshift-ingress | grep "-serving-cert" | awk '{print $1}') -o jsonpath='{.data.tls\.crt}'| base64 -d > cert.crt
        oc get secret -n openshift-ingress $(kubectl get secrets -n openshift-ingress | grep "-serving-cert" | awk '{print $1}') -o jsonpath='{.data.tls\.key}'| base64 -d > cert.key
        oc create secret tls -n turbonomic nginx-ingressgateway-certs --cert=./cert.crt --key=./cert.key
  ignore_errors: true
  args:
    executable: /bin/bash




- name: 🚀 TURBONOMIC - Create Turbonomic Operator Group
  kubernetes.core.k8s:
    state: present
    namespace: turbonomic
    src: ./templates/turbonomic/turbo-operatorgroup.yaml
  


- name: 🚀 TURBONOMIC - Create Turbonomic Subscription
  kubernetes.core.k8s:
    state: present
    namespace: turbonomic
    src: ./templates/turbonomic/turbo-subscription.yaml
  



- name: 🕦 TURBONOMIC - Wait for CRD to become ready
  shell: oc get crd -n turbonomic xls.charts.helm.k8s.io --ignore-not-found  --no-headers| grep -c ""
  register: kubectl_get_pods
  until: kubectl_get_pods.stdout == "1"
  retries: 500
  delay: 15


- name: 📣 OCP CONSOLE - Create Openshift NOTIFICATION
  shell: |
    cat <<EOF | oc apply -f -
    apiVersion: console.openshift.io/v1
    kind: ConsoleNotification
    metadata:
      name: ibm-concert-operate-notification-status
    spec:
      backgroundColor: '#ffd500'
      color: '#000'
      location: {{global_config.position_ocp_notifications | default("BannerTop")}}
      text: 'Installing {{current_feature.kind}} - Create Instance'    
    EOF
  ignore_errors: true
  args:
    executable: /bin/bash
  when: (global_config.create_ocp_notifications | default(true))|bool == true  



- name: 🚀 TURBONOMIC - Create Turbonomic Instance
  kubernetes.core.k8s:
    state: present
    namespace: turbonomic
    template: ./templates/turbonomic/turbo-instance.j2
  when: (current_feature.concert_optimise_lite | default(false))|bool == false  



- name: 🚀 TURBONOMIC - Create Turbonomic Lite Instance
  kubernetes.core.k8s:
    state: present
    namespace: turbonomic
    template: ./templates/turbonomic/turbo-instance_lite.j2
  when: (current_feature.concert_optimise_lite | default(false))|bool == true  
  


- name: 🕦 TURBONOMIC - Wait for 120 seconds
  shell: sleep 120




# --------------------------------------------------------------------------------------------------------------------------------------
# Wait for turbonomic Namespace to be ready
# --------------------------------------------------------------------------------------------------------------------------------------

- name: 📣 OCP CONSOLE - Create Openshift NOTIFICATION
  shell: |
    cat <<EOF | oc apply -f -
    apiVersion: console.openshift.io/v1
    kind: ConsoleNotification
    metadata:
      name: ibm-concert-operate-notification-status
    spec:
      backgroundColor: '#ff7700'
      color: '#000'
      location: {{global_config.position_ocp_notifications | default("BannerTop")}}
      text: 'Installing {{current_feature.kind}} - 🕦 Wait for Turbonomic to be ready (about 10-15 minutes) - Started at $(date +%H:%M) UTC'    
    EOF
  ignore_errors: true
  args:
    executable: /bin/bash
  when: (global_config.create_ocp_notifications | default(true))|bool == true  


- name: 🕦 TURBONOMIC - Wait for >80 pods in namespace turbonomic
  shell: oc get po -n turbonomic |grep "1/"| wc -l
  register: kubectl_num_pods
  until: kubectl_num_pods.stdout|int > 80
  retries: 500
  delay: 15
  when: (current_feature.concert_optimise_lite | default(false))|bool == false  


- name: 🕦 TURBONOMIC - Wait for >20 pods in namespace turbonomic
  shell: oc get po -n turbonomic |grep "1/"| wc -l
  register: kubectl_num_pods
  until: kubectl_num_pods.stdout|int > 16
  retries: 500
  delay: 15
  when: (current_feature.concert_optimise_lite | default(false))|bool == true  


- name: 🕦 TURBONOMIC - Wait for turbonomic to become ready
  shell: oc get po -n turbonomic | grep -v Running |grep -v Completed|grep -v Error|grep -v prometheus-server |grep -v concert-gateway |grep -v postgres-0| grep -c ""
  register: kubectl_get_pods
  until: kubectl_get_pods.stdout == "1"
  retries: 500
  delay: 15