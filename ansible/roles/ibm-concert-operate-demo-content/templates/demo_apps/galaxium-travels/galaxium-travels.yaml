# Build these images before applying this manifest, or replace the image values
# with registry-qualified names that are accessible to the cluster:
#   docker build --platform linux/amd64 -t galaxium-travels-backend:latest booking_system_backend
#   docker build --platform linux/amd64 -t galaxium-travels-java-service:latest booking_system_inventory_hold_service
#   docker build --platform linux/amd64 --build-arg VITE_API_URL=http://localhost:8001 \
#     -t galaxium-travels-frontend:latest booking_system_frontend
apiVersion: v1
kind: Namespace
metadata:
  name: galaxium-travels
---

# Source: galaxium-travels/templates/web-service.yaml
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  namespace: galaxium-travels
  name: frontend
spec:
  to:
    kind: Service
    name: frontend
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  namespace: galaxium-travels
  name: galaxium
spec:
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
  wildcardPolicy: None

---
# Source: galaxium-travels/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: galaxium-travels
  name: galaxium-travels
---
# Source: galaxium-travels/templates/clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galaxium-travels
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: galaxium-travels
  namespace: galaxium-travels
---
# Source: galaxium-travels/templates/clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: galaxium-travels-default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: default
  namespace: galaxium-travels


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: galaxium-config
  namespace: galaxium-travels
data:
  POSTGRES_DB: galaxium_booking
  POSTGRES_USER: galaxium
  CORS_ORIGINS: http://localhost:5173,http://localhost
  JAVA_SERVICE_URL: http://java-service:8080
  PYTHON_BACKEND_URL: http://backend:8080
  SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/holds.db
  SEED_DEMO_DATA: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: galaxium-secrets
  namespace: galaxium-travels
type: Opaque
stringData:
  POSTGRES_PASSWORD: local_dev_password
  DATABASE_URL: postgresql://galaxium:local_dev_password@postgres:5432/galaxium_booking
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: galaxium-travels
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: galaxium-travels
spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            # Keep the PVC mounted at /var/lib/postgresql/data,
            # but initialize PostgreSQL inside an empty subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: galaxium-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: galaxium-config
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: galaxium-secrets
                  key: POSTGRES_PASSWORD

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-public
  namespace: galaxium-travels
spec:
  type: LoadBalancer
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5433
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: galaxium-travels
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:14-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U galaxium -d galaxium_booking; do sleep 2; done
      containers:
        - name: backend
          image: quay.io/niklaushirt/galaxium-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: galaxium-secrets
                  key: DATABASE_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: galaxium-config
                  key: CORS_ORIGINS
            - name: JAVA_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: galaxium-config
                  key: JAVA_SERVICE_URL
            - name: SEED_DEMO_DATA
              valueFrom:
                configMapKeyRef:
                  name: galaxium-config
                  key: SEED_DEMO_DATA
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: galaxium-travels
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend-public
  namespace: galaxium-travels
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: java-data
  namespace: galaxium-travels
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-service
  namespace: galaxium-travels
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: java-service
  template:
    metadata:
      labels:
        app: java-service
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://backend:8080/; do sleep 2; done
      containers:
        - name: java-service
          image: quay.io/niklaushirt/galaxium-hold-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PYTHON_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: galaxium-config
                  key: PYTHON_BACKEND_URL
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: galaxium-config
                  key: SPRING_DATASOURCE_URL
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: java-data
              mountPath: /app/data
      volumes:
        - name: java-data
          persistentVolumeClaim:
            claimName: java-data
---
apiVersion: v1
kind: Service
metadata:
  name: java-service
  namespace: galaxium-travels
spec:
  selector:
    app: java-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: java-service-public
  namespace: galaxium-travels
spec:
  type: LoadBalancer
  selector:
    app: java-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: galaxium-travels
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://backend:8080/; do sleep 2; done
      containers:
        - name: frontend
          image: quay.io/niklaushirt/galaxium-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: galaxium-travels
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-public
  namespace: galaxium-travels
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: http
