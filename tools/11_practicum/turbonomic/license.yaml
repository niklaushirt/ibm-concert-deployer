apiVersion: batch/v1
kind: Job
metadata:
  name: ibm-turbonomic-license
  namespace: ibm-installer
  labels:
   aiops-type: data-load-job
spec:
  template:
    spec:
      containers:
        - name: license
          image: quayniklaushirt/ibm-aiops-tools:5.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              #!/bin/bash
              git clone https://github.com/niklaushirt/ibm-concert-deployer.git -b main && cd ibm-concert-deployer && echo $LICENSE_KEY > /tmp/SCRIPT_PWD.txt && ansible-vault decrypt  --vault-password-file /tmp/SCRIPT_PWD.txt ./tools/11_practicum/turbonomic/concert_optimise_license.enc --output /tmp/concert_optimise_license.sh && chmod +x /tmp/concert_optimise_license.sh && /tmp/concert_optimise_license.sh
          env:
          - name: LICENSE_KEY
            value : "CHANGEME"
      restartPolicy: Never